services:

  frontend:
    build: ./cloudcart-frontend
    command: sh -c "rm -rf .next/dev && npm run dev"
    ports:
      - "3000:3000"
    volumes:
      - ./cloudcart-frontend:/app
      - /app/node_modules
      - frontend_next:/app/.next
    depends_on:
      - backend

  backend:
    build: ./cloudcart-backend
    command: sh -c "npm install && npx prisma generate && npm run dev"
    ports:
      - "5000:5000"
    volumes:
      - ./cloudcart-backend:/app
      - /app/node_modules
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/cloudcart
    depends_on:
      - db

  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cloudcart
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
  frontend_next:
